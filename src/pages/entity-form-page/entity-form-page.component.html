<div class="entity-form-page container">
  <app-entity-form
    *ngIf="entity && !loading"
    [entity]="entity"
    [(model)]="model"
    [submitFn]="save"
    [submitLabel]="isEdit ? 'Update Record' : 'Create Record'"
    (cancelEvent)="onCancel()">
  </app-entity-form>
  
  <div *ngIf="loading" class="loading-text">
    Loading record details...
  </div>
</div>
