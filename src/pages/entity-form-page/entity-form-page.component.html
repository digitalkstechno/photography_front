<div class="entity-form-page">

  <h2>{{ isEdit ? 'Edit' : 'New' }} {{ entity.label }}</h2>

  <p *ngIf="loading">Loading...</p>

  <app-entity-form
    *ngIf="entity && !loading"
    [entity]="entity"
    [(model)]="model"
    [submitFn]="save"
    [submitLabel]="isEdit ? 'Update' : 'Save'">
  </app-entity-form>

</div>
