<div class="booking-form-wrapper">
  <div class="page-header">
    <div class="header-left">
      <h1>{{ isEdit ? 'Edit' : 'Create' }} Booking</h1>
      <p class="subtitle">Configure client schedule and photography team for this session</p>
    </div>
    <div class="header-right">
      <button class="btn-outline" (click)="cancel()">Cancel</button>
      <button class="btn-primary-pro" (click)="save()" [disabled]="bookingForm.invalid || loading">
        {{ loading ? 'Saving...' : 'Confirm Booking' }}
      </button>
    </div>
  </div>

  <div class="page-content" [formGroup]="bookingForm">
    <!-- Main Booking Details -->
    <div class="section-card mb-4">
      <div class="section-header">
        <h3>General Information</h3>
      </div>
      <div class="section-body fields-grid">
        <div class="field-container">
          <label class="field-label">Customer <span class="required-mark">*</span></label>
          <select formControlName="customerId" class="pro-select">
            <option [ngValue]="null">-- Select Customer --</option>
            <option *ngFor="let c of customers" [value]="c.id">{{ c.name }}</option>
          </select>
        </div>

        <div class="field-container">
          <label class="field-label">Service Package</label>
          <select formControlName="packageId" class="pro-select">
            <option [ngValue]="null">Custom / No Package</option>
            <option *ngFor="let p of packagesList" [value]="p.id">{{ p.name }} (₹{{ p.price | number }})</option>
          </select>
        </div>

        <div class="field-container">
          <label class="field-label">Status <span class="required-mark">*</span></label>
          <select formControlName="status" class="pro-select">
            <option value="TENTATIVE">Tentative</option>
            <option value="CONFIRMED">Confirmed</option>
            <option value="COMPLETED">Completed</option>
            <option value="CANCELLED">Cancelled</option>
          </select>
        </div>

        <div class="field-container full-width">
          <label class="field-label">Internal Instructions</label>
          <textarea formControlName="notes" class="pro-textarea" placeholder="Add any special instructions or notes..."></textarea>
        </div>
      </div>
    </div>

    <!-- Shoot Events Section -->
    <div class="section-card">
      <div class="section-header">
        <h3>Shoot Events</h3>
        <button type="button" class="btn-outline-sm" (click)="addEvent()">+ Add Event</button>
      </div>

      <div formArrayName="events" class="events-list">
        <div *ngFor="let event of eventControls; let i = index" [formGroupName]="i" class="event-item">
          <div class="event-item-header">
            <span class="event-badge">EVENT #{{ i + 1 }}</span>
            <button type="button" class="btn-icon-link danger" (click)="removeEvent(i)" title="Remove Event">🗑</button>
          </div>
          
          <div class="fields-grid mt-2">
            <div class="field-container">
              <label class="field-label">Event Type <span class="required-mark">*</span></label>
              <input type="text" formControlName="eventType" class="pro-input" placeholder="e.g. Wedding Ceremony" />
            </div>

            <div class="field-container">
              <label class="field-label">Shoot Date <span class="required-mark">*</span></label>
              <input type="date" formControlName="eventDate" class="pro-input" />
            </div>

            <div class="field-container">
              <label class="field-label">Venue Location</label>
              <input type="text" formControlName="location" class="pro-input" placeholder="Google Maps link or address" />
            </div>

            <div class="field-container">
              <label class="field-label">Assigned Photographer</label>
              <select formControlName="photographerId" class="pro-select">
                <option [ngValue]="null">Unassigned</option>
                <option *ngFor="let u of photographers" [value]="u.id">{{ u.name }}</option>
              </select>
            </div>

            <div class="field-container full-width">
              <label class="field-label">Event Note</label>
              <input type="text" formControlName="notes" class="pro-input" placeholder="Specific notes for this event" />
            </div>
          </div>
        </div>

        <div *ngIf="eventControls.length === 0" class="empty-state">
          No events added. Click "+ Add Event" to begin.
        </div>
      </div>
    </div>
  </div>
</div>
