<div class="booking-form-wrapper">
  <div class="page-header">
    <div class="header-left">
      <h1>{{ isEdit ? 'Edit' : 'Create' }} Event</h1>
      <p class="subtitle">Schedule a photography event with client and date details</p>
    </div>
    <div class="header-right">
      <button class="btn-outline" (click)="cancel()">Cancel</button>
      <button class="btn-primary-pro" (click)="save()" [disabled]="eventForm.invalid || loading">
        {{ loading ? 'Saving...' : (isEdit ? 'Update Event' : 'Create Event') }}
      </button>
    </div>
  </div>

  <div class="page-content" [formGroup]="eventForm">
    <!-- General Information -->
    <div class="section-card mb-4">
      <div class="section-header">
        <h3>General Information</h3>
      </div>
      <div class="section-body fields-grid">
        <div class="field-container">
          <label class="field-label">Customer <span class="required-mark">*</span></label>
          <select formControlName="customer" class="pro-select">
            <option [ngValue]="null">-- Select Customer --</option>
            <option *ngFor="let c of customers" [value]="c._id">{{ c.name }}</option>
          </select>
        </div>

        <div class="field-container">
          <label class="field-label">Event Type <span class="required-mark">*</span></label>
          <select formControlName="eventType" class="pro-select">
            <option *ngFor="let t of eventTypes" [value]="t">{{ t }}</option>
          </select>
        </div>

        <div class="field-container full-width">
          <label class="field-label">Event Title</label>
          <input type="text" formControlName="title" class="pro-input" placeholder="e.g., Sharma Wedding Ceremony" />
        </div>

        <div class="field-container">
          <label class="field-label">Start Date <span class="required-mark">*</span></label>
          <input type="date" formControlName="startDate" class="pro-input" />
        </div>

        <div class="field-container">
          <label class="field-label">End Date <span class="required-mark">*</span></label>
          <input type="date" formControlName="endDate" class="pro-input" />
        </div>

        <div class="field-container full-width">
          <label class="field-label">Location</label>
          <input type="text" formControlName="location" class="pro-input" placeholder="Venue address or Google Maps link" />
        </div>

        <div class="field-container">
          <label class="field-label">Status</label>
          <select formControlName="status" class="pro-select">
            <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
          </select>
        </div>

        <div class="field-container">
          <label class="field-label">Service Package</label>
          <select formControlName="package" class="pro-select">
            <option [ngValue]="null">No Package</option>
            <option *ngFor="let p of packagesList" [value]="p._id">{{ p.name }} (₹{{ p.price }})</option>
          </select>
        </div>

        <div class="field-container">
          <label class="field-label">Total Amount (₹)</label>
          <input type="number" formControlName="totalAmount" class="pro-input" placeholder="0" />
        </div>

        <div class="field-container full-width">
          <label class="field-label">Notes</label>
          <textarea formControlName="notes" class="pro-textarea" placeholder="Any special instructions..."></textarea>
        </div>
      </div>
    </div>
  </div>
</div>
