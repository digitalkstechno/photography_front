<div class="entity-page-container container" *ngIf="entity">

  <div class="card-premium card-header-black mb-5">
    <div class="header-inner">
      <div class="title-group">
        <h1 class="text-white">{{ entity.label }}</h1>
        <p class="text-muted-light">Manage and organize your {{ entity.label.toLowerCase() }} records</p>
      </div>
    </div>

    <div class="p-4">
      <app-entity-list 
        [entity]="entity" 
        [baseRoute]="'/admin/' + entity.key" 
        (editRecord)="onEdit($event)">
      </app-entity-list>
    </div>
  </div>

</div>
