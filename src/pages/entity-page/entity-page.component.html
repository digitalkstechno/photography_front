<div class="entity-page-wrapper container" *ngIf="entity">

  <div class="page-header">
    <div class="header-left">
      <h1>{{ entity.label }}</h1>
      <p class="subtitle">Manage and organize your {{ entity.label.toLowerCase() }} records</p>
    </div>
    <div class="header-right">
      <button class="btn-primary-pro" (click)="onNew()">+ Add {{ entity.label }}</button>
    </div>
  </div>

  <div class="page-content layout-with-sidebar" *ngIf="entity">
    <div class="main-list-area">
      <div class="section-card">
        <app-entity-list
          [entity]="entity"
          [baseRoute]="'/admin/' + entity.key"
          [reloadTrigger]="activeFilters"
          [extraParams]="activeFilters"
          (editRecord)="onEdit($event)"
          (toggleFilters)="onToggleFilters()">
        </app-entity-list>
      </div>
    </div>

    <app-filter-panel
      *ngIf="entity.filters && entity.filters.length"
      [filters]="entity.filters!"
      [isOpen]="isFilterOpen"
      (filterChange)="onFilterChange($event)"
      (close)="isFilterOpen = false">
    </app-filter-panel>
  </div>

</div>
