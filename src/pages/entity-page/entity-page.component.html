<div class="entity-page-wrapper" *ngIf="entity">
  
  <div class="page-header">
    <div class="header-left">
      <h1>{{ entity.label }}</h1>
      <p class="subtitle">Manage and organize your {{ entity.label.toLowerCase() }} records</p>
    </div>
    <div class="header-right">
      <button class="btn-primary-pro" (click)="onNew()">+ Add {{ entity.label }}</button>
    </div>
  </div>

  <div class="page-content">
    <div class="section-card">
      <app-entity-list 
        [entity]="entity" 
        [baseRoute]="'/admin/' + entity.key" 
        (editRecord)="onEdit($event)">
      </app-entity-list>
    </div>
  </div>

</div>
