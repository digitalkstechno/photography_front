<div class="booking-confirmation-wrapper container">
  <div class="card-premium card-header-black">
    <div class="header-inner">
      <div class="title-group">
        <h2 class="text-white">Booking Confirmed</h2>
        <p class="text-muted-light">Thank you for choosing our photography services!</p>
      </div>
    </div>
    
    <div class="p-5 text-center">
      <div class="success-icon mb-4">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <p>Your session has been successfully scheduled. We will reach out to you shortly for coordination.</p>
      <div class="mt-4" *ngIf="quoteId">
          <span class="badge badge-black">Reference #: {{ quoteId }}</span>
      </div>
    </div>
  </div>
</div>
