<div class="booking-list-wrapper">
  <div class="page-header">
    <div class="header-left">
      <h1>Bookings</h1>
      <p class="subtitle">Overview of all confirmed and pending photography sessions</p>
    </div>
    <div class="header-right">
      <button class="btn-primary-pro" (click)="onNew()">+ New Booking</button>
    </div>
  </div>

  <div class="page-content">
    <div class="section-card">
      <app-entity-list [entity]="config" baseRoute="/bookings"></app-entity-list>
    </div>
  </div>
</div>
