<div class="dashboard">

  <h2 class="title">Dashboard</h2>

  <div class="cards" *ngIf="!loading">

    <div class="card">
      <h3>Total Invoices</h3>
      <p class="value">{{ totalInvoices }}</p>
    </div>

    <div class="card card-green">
      <h3>Total Paid</h3>
      <p class="value">₹ {{ totalPaid | number:'1.0-0' }}</p>
    </div>

    <div class="card card-red">
      <h3>Outstanding Balance</h3>
      <p class="value">₹ {{ totalOutstanding | number:'1.0-0' }}</p>
    </div>

  </div>

  <p *ngIf="loading" class="loading-text">Loading dashboard...</p>

</div>
