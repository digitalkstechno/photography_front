<div class="types-container">
  <label class="dropdown-label">Select Document Type:</label>
  <select [(ngModel)]="selected" (ngModelChange)="choose($event)" class="type-dropdown">
    <option [ngValue]="null" disabled selected>-- Select Nationality & Size --</option>
    <option *ngFor="let t of types" [ngValue]="t">
      {{ t.name }} ({{ t.width_mm }} × {{ t.height_mm }} mm)
    </option>
  </select>
</div>
