<label>Zoom</label>
<input type="range" min="0.5" max="2" step="0.1"
  [(ngModel)]="zoom" (input)="emit()" />

<label>Brightness</label>
<input type="range" min="50" max="150"
  [(ngModel)]="brightness" (input)="emit()" />

<label>Contrast</label>
<input type="range" min="50" max="150"
  [(ngModel)]="contrast" (input)="emit()" />
