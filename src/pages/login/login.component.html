<div class="login-wrapper">
  <div class="login-container">
    <div class="login-brand">
      <div class="brand-logo">P</div>
      <h1 class="brand-name">Photography Management</h1>
    </div>

    <div class="login-card">
      <div class="card-header">
        <h2>Sign In</h2>
        <p>Enter your credentials to access your dashboard</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onLogin()" novalidate class="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="pro-input"
            placeholder="admin@photography.com"
          />
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="#" class="forgot-link">Forgot?</a>
          </div>
          <input
            id="password"
            type="password"
            formControlName="password"
            class="pro-input"
            placeholder="••••••••"
          />
        </div>

        <button type="submit" class="btn-primary-pro w-100 mt-2" [disabled]="loading || form.invalid">
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>

        <div class="divider">
          <span>or continue with</span>
        </div>

        <button type="button" class="btn-outline w-100 google-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.48 10.92v3.28h7.84c-.24 1.84-.908 3.152-1.928 4.176-1.288 1.288-3.312 2.696-6.912 2.696-5.576 0-10.08-4.504-10.08-10.08s4.504-10.08 10.08-10.08c3.032 0 5.256 1.192 6.88 2.768l2.312-2.312c-2.304-2.144-5.232-3.456-9.192-3.456-7.256 0-13.192 5.936-13.192 13.192s5.936 13.192 13.192 13.192c3.928 0 6.88-1.288 9.248-3.752 2.392-2.392 3.136-5.744 3.136-8.544 0-.816-.072-1.576-.192-2.32h-12.192z"/>
          </svg>
          Google Account
        </button>

        <p class="error-msg" *ngIf="error">{{ error }}</p>
      </form>
    </div>

    <div class="login-footer">
      <p>&copy; 2026 Photography Business. All rights reserved.</p>
    </div>
  </div>
</div>
