<div class="login-container">
  <h2>Login</h2>

  <div class="input-group">
    <label>Username</label>
    <input type="text" />
  </div>

  <div class="input-group">
    <label>Password</label>
    <input type="password" />
  </div>

  <button type="button" (click)="onLogin()">Login</button>

  <p class="forgot-password">
    <a href="#">Forgot Password?</a>
  </p>
</div>
