<div class="auth-page">
  <div class="card-premium login-card">
    <div class="title-group text-center mb-5">
      <h1 class="title">Login Your Account</h1>
      <p class="subtitle text-muted-light">Welcome back! Please enter your details.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onLogin()" novalidate>
      <div class="form-field">
        <label>Work Email</label>
        <div class="input-wrapper">
           <input
             type="email"
             formControlName="email"
             class="input"
             placeholder="you@company.com"
           />
        </div>
      </div>

      <div class="form-field">
        <label>Security Password</label>
        <div class="input-wrapper">
           <input
             type="password"
             formControlName="password"
             class="input"
             placeholder="••••••••"
           />
        </div>
      </div>

      <div class="auth-actions mt-5">
        <button type="submit" class="btn-premium btn-primary w-100" [disabled]="loading || form.invalid">
          {{ loading ? 'Authenticating...' : 'Sign In' }}
        </button>
        
        <div class="divider-text">
            <span>Or continue with</span>
        </div>

        <button type="button" class="btn-premium btn-secondary w-100 social-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.908 3.152-1.928 4.176-1.288 1.288-3.312 2.696-6.912 2.696-5.576 0-10.08-4.504-10.08-10.08s4.504-10.08 10.08-10.08c3.032 0 5.256 1.192 6.88 2.768l2.312-2.312c-2.304-2.144-5.232-3.456-9.192-3.456-7.256 0-13.192 5.936-13.192 13.192s5.936 13.192 13.192 13.192c3.928 0 6.88-1.288 9.248-3.752 2.392-2.392 3.136-5.744 3.136-8.544 0-.816-.072-1.576-.192-2.32h-12.192z"/></svg>
          Google
        </button>
      </div>

      <div class="forgot-link text-center mt-4">
        <a href="#">Forgot password?</a>
      </div>

      <p class="error mt-3 text-center" *ngIf="error">{{ error }}</p>
    </form>
  </div>
</div>
