<div class="reports-page-wrapper container">
  <div class="page-header">
    <div class="header-left">
      <h1>Business Reports</h1>
      <p class="subtitle">Analyze revenue, growth and session statistics</p>
    </div>
    <div class="header-right">
      <button class="btn-outline">Export All</button>
    </div>
  </div>

  <div class="page-content">
    <div class="section-card">
      <app-table
        [columns]="columns"
        [fetchFn]="fetchReports">
      </app-table>
    </div>
  </div>
</div>
