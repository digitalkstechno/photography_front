<div class="dashboard-container">

  <!-- Sidebar -->
  <aside class="sidebar">

    <h3 class="logo">MyApp</h3>

    <ul class="menu">

      <li (click)="navigate('/dashboard')">
        🏠 Dashboard
      </li>

      <!-- Dynamic Entities -->
      <li *ngFor="let entity of entities" (click)="navigate('/admin/' + entity.key)">

        {{ '📁'}} {{entity.label}}

      </li>

      <li (click)="navigate('/reports')">
        📊 Reports
      </li>

      <li (click)="navigate('/settings')">
        ⚙️ Settings
      </li>

      <li class="logout" (click)="logout()">
        🚪 Logout
      </li>

    </ul>

  </aside>


  <!-- Main Section -->
  <div class="main-content">

    <!-- Topbar -->
    <header class="topbar">
      <span class="welcome">Welcome 👋</span>
    </header>

    <!-- Page Content -->
    <section class="content">
      <router-outlet></router-outlet>
    </section>

  </div>

</div>
