<div class="pro-table-wrapper">

  <!-- Search and Actions Bar -->
  <div class="table-controls">
    <div class="search-box">
      <span class="icon">🔍</span>
      <input
        type="text"
        placeholder="Filter results..."
        (input)="onSearch($event)"
        class="search-input"
      />
    </div>

    <!-- DYNAMIC FILTERS (REMOVED: Moved to Sidebar) -->

    <div class="controls-right" style="margin-left: auto;">
      <button class="btn-filter-trigger" [class.active]="isFilterActive" (click)="onToggleFilter()">
        <span class="m-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z" />
          </svg>
        </span>
        <span class="m-text">Filters</span>
        <span class="active-badge" *ngIf="activeFilterCount > 0"></span>
      </button>
    </div>
  </div>

  <!-- Main Table Section -->
  <div class="table-responsive">
    <table class="accounting-table">
      <thead>
        <tr>
          <th *ngFor="let col of columns" (click)="sort(col.key)" class="sortable">
            <div class="th-content">
              {{ col.label.toUpperCase() }}
              <span class="sort-icon">↕</span>
            </div>
          </th>
          <th *ngIf="updateRoute || rowActions" class="text-center">ACTION</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let row of data">
          <td *ngFor="let col of columns">
             <div [ngSwitch]="col.format">
                <span *ngSwitchCase="'boolean'"
                      class="badge-pill"
                      [class.success]="getValue(row, col.key)"
                      [class.danger]="!getValue(row, col.key)">
                  {{ displayValue(row, col) }}
                </span>

                <span *ngSwitchCase="'currency'" class="font-medium">
                  {{ displayValue(row, col) }}
                </span>

                <span *ngSwitchDefault>
                  {{ displayValue(row, col) }}
                </span>
             </div>
          </td>

          <!-- ACTIONS -->
          <td *ngIf="updateRoute || rowActions">
            <div class="row-actions">
              <!-- Default Edit Action -->
              <button *ngIf="updateRoute" (click)="goToUpdate(row)" 
                      class="btn-soft btn-soft-purple" title="Edit Record">
                ✏️ Edit
              </button>

              <ng-container *ngIf="rowActions">
                  <button *ngFor="let action of rowActions"
                          class="btn-soft"
                          [ngClass]="getSoftClass(action.label)"
                          (click)="handleAction(action, row)"
                          [title]="action.label"
                          [hidden]="!isActionVisible(action, row)">
                      
                      <!-- Dynamic Icon -->
                      <span *ngIf="action.icon">{{ action.icon }}</span>

                      <!-- Default Icons for common labels if no icon provided -->
                      <ng-container *ngIf="!action.icon">
                        <span *ngIf="action.label === 'Ledger'">📒</span>
                        <span *ngIf="action.label === 'Book' || action.label === 'Booking'">📸</span>
                        <span *ngIf="action.label === 'Edit'">✏️</span>
                        <span *ngIf="action.label === 'Delete'">🗑️</span>
                        <span *ngIf="action.label !== 'Ledger' && action.label !== 'Book' && action.label !== 'Booking' && action.label !== 'Edit' && action.label !== 'Delete'">⚡</span>
                      </ng-container>

                      <!-- Action Label -->
                      <span>{{ action.label }}</span>
                  </button>
              </ng-container>
            </div>
          </td>
        </tr>

        <!-- Empty State -->
        <tr *ngIf="!data.length">
          <td [attr.colspan]="columns.length + 1" class="text-center py-5 text-muted">
            No records found.
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Footer / Pagination -->
  <div class="table-footer">
    <div class="footer-info">
      Showing <b>{{ data.length }}</b> of <b>{{ total }}</b> entries

      <span class="limit-selector ms-3">
        <label>Per page: </label>
        <select class="form-select-sm limit-select" [(ngModel)]="limit" (change)="onLimitChange()">
          <option [ngValue]="10">10</option>
          <option [ngValue]="25">25</option>
          <option [ngValue]="50">50</option>
          <option [ngValue]="100">100</option>
        </select>
      </span>
    </div>

    <div class="pagination">
      <button class="btn-page" (click)="prev()" [disabled]="page === 1">Back</button>
      <span class="page-indicator">Page <b>{{ page }}</b></span>
      <button class="btn-page" (click)="next()" [disabled]="page * limit >= total">Next</button>
    </div>
  </div>

</div>
