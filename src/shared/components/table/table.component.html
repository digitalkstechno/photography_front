<div class="table-wrapper">

  <!-- Top actions -->
  <div class="table-actions">
    <input
      type="text"
      placeholder="Search..."
      (input)="onSearch($event)"
    />

    <!-- ✅ ADD BUTTON (optional) -->
    <button *ngIf="addRoute" (click)="goToAdd()">
      Add New
    </button>
  </div>

  <table>
    <thead>
      <tr>
        <th *ngFor="let col of columns" (click)="sort(col.key)">
          {{ col.label }}
        </th>

        <!-- ✅ ACTION COLUMN -->
        <th *ngIf="updateRoute">Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let row of data">
        <td *ngFor="let col of columns">
          {{ getValue(row, col.key) }}
        </td>

        <!-- ✅ UPDATE BUTTON -->
        <td *ngIf="updateRoute">
          <button (click)="goToUpdate(row)">
            Update
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="pagination">
    <button (click)="prev()">Prev</button>
    <span>{{ page }}</span>
    <button (click)="next()">Next</button>
  </div>

</div>
