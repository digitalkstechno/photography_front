<div class="modal-overlay" *ngIf="modalData" (click)="cancel()">
  <div class="modal-card" [ngClass]="modalData.type" (click)="$event.stopPropagation()">
    
    <!-- HEADER -->
    <div class="modal-header">
      <div class="icon-circle" [attr.data-content]="getIcon()"></div>
      <h3>{{ modalData.title }}</h3>
    </div>

    <!-- BODY -->
    <div class="modal-body">
      <p>{{ modalData.message }}</p>
    </div>

    <!-- FOOTER -->
    <div class="modal-footer">
      <button 
        *ngIf="modalData.type === 'confirm'" 
        class="btn-secondary-sm" 
        (click)="cancel()"
      >
        {{ modalData.cancelText || 'Cancel' }}
      </button>
      
      <button 
        class="btn-primary-sm" 
        [ngClass]="'btn-' + modalData.type"
        (click)="confirm()"
      >
        {{ modalData.confirmText || 'OK' }}
      </button>
    </div>

  </div>
</div>
